<script>
(() => {
/* ===== Canvas ===== */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
function fit(){
  const W=innerWidth,H=innerHeight,dpr=Math.max(1,devicePixelRatio||1);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
}
addEventListener('resize',fit); fit();

/* ===== DOM ===== */
const timeEl = document.getElementById('time');
const hitsEl = document.getElementById('hits');
const startPane = document.getElementById('start');
const endPane   = document.getElementById('end');
const endTitle  = document.getElementById('endTitle');
const endBG1    = document.getElementById('endBG1');
const endBtns   = document.getElementById('endBtns');
const btnStart  = document.getElementById('btnStart');
const btnAgain  = document.getElementById('btnAgain');

/* ===== Assets ===== */
const Img=s=>{const i=new Image(); i.src=s; return i;};
const angelPainting=Img('angel-painted.png'); // Jake-approved portrait-inspired angel.
const wiseManPainting=Img('wise-man-painted.png');
const companionPainting=Img('wise-men-companions-painted.png');
const sandstoneRock=Img('sandstone-rock-v1.png');
const captain=Img('captain-orbs.png'); // Canonical Captain cameo, shared with Orbs and Noah.
const bg=Img('background.png'); // preserved as the original-scene fallback
const journeyBackgrounds=[
  Img('background-far-bethlehem.png'),
  Img('background-approach-bethlehem.png'),
  Img('background-arrival-bethlehem-large.png')
];
// This game is a 60-second journey: Bethlehem comes into view at 10s and 25s.
// The final background then stays put for the remaining 35 seconds and finale.
const JOURNEY_BACKGROUND_TIMING={ approachAt:10, arrivalAt:25, fadeSeconds:1 };
const WIN_A='ending_scene_merry_christmas_family.png';
const LOSE ='lose-cast-encouragement-v1.png';

/* ===== Audio (working build) ===== */
let AC=null,gSFX=null,gMusic=null;
function initAudio(){ if(AC) return; AC=new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  gMusic=AC.createGain(); gMusic.gain.value=.12; gMusic.connect(master);
  gSFX=AC.createGain(); gSFX.gain.value=.45; gSFX.connect(master);
}
// Public-domain Silent Night melody, synthesized locally; no recording or download.
const NightMusic=(()=>{
  const tune=[
    ['G4',1.5],['A4',.5],['G4',1],['E4',3],
    ['G4',1.5],['A4',.5],['G4',1],['E4',3],
    ['D5',2],['D5',1],['B4',3],['C5',2],['C5',1],['G4',3],
    ['A4',2],['A4',1],['C5',1.5],['B4',.5],['A4',1],
    ['G4',1.5],['A4',.5],['G4',1],['E4',3],
    ['A4',2],['A4',1],['C5',1.5],['B4',.5],['A4',1],
    ['G4',1.5],['A4',.5],['G4',1],['E4',3],
    ['D5',2],['D5',1],['F5',1.5],['D5',.5],['B4',1],['C5',3],['E5',3],
    ['C5',1],['G4',1],['E4',1],['G4',1.5],['F4',.5],['D4',1],['C4',3]
  ];
  const midi={C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77};
  const voices=new Set(); let enabled=true;
  function stop(){
    for(const voice of voices){try{voice.stop();}catch{} voice.disconnect();}
    voices.clear();
  }
  function start(){
    stop(); if(!AC || !gMusic) return;
    gMusic.gain.setValueAtTime(enabled?.12:0,AC.currentTime);
    // 84 quarter notes/minute: gentle 6/8 phrasing, with a small breath on each note.
    const beat=60/84; let offset=0;
    while(offset<61){
      for(const [pitch,beats] of tune){
        if(offset>=61) break;
        const at=AC.currentTime+.06+offset, duration=beats*beat;
        const oscillator=AC.createOscillator(), envelope=AC.createGain();
        oscillator.type='sine'; oscillator.frequency.value=440*2**((midi[pitch]-69)/12);
        envelope.gain.setValueAtTime(0,at);
        envelope.gain.linearRampToValueAtTime(.68,at+.018);
        envelope.gain.exponentialRampToValueAtTime(.12,at+duration*.72);
        envelope.gain.linearRampToValueAtTime(0,at+duration*.96);
        oscillator.connect(envelope).connect(gMusic); voices.add(oscillator);
        oscillator.onended=()=>{voices.delete(oscillator);oscillator.disconnect();envelope.disconnect();};
        oscillator.start(at); oscillator.stop(at+duration);
        offset+=duration;
      }
    }
  }
  document.getElementById('musicToggle').addEventListener('click',()=>{
    enabled=!enabled;
    if(gMusic)gMusic.gain.setTargetAtTime(enabled?.12:0,AC.currentTime,.035);
    const button=document.getElementById('musicToggle');
    button.textContent='Music: '+(enabled?'On':'Off');button.setAttribute('aria-pressed',String(enabled));
  });
  return {start,stop};
})();
const SFX={
  poof(){ if(!AC) return; const now=AC.currentTime;
    const src=AC.createBufferSource(); const len=AC.sampleRate*.35, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.5; for(let p=0;p<3;p++) for(let i=1;i<len;i++) d[i]=d[i-1]*.9+d[i]*.1;
    src.buffer=buf; const g=AC.createGain(); g.gain.value=0; src.connect(g).connect(gSFX);
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.8,now+.02); g.gain.linearRampToValueAtTime(0,now+.35); src.start();
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=65; const go=AC.createGain(); go.gain.value=0; o.connect(go).connect(gSFX);
    go.gain.setValueAtTime(.5,now); go.gain.exponentialRampToValueAtTime(.001,now+.3); o.start(now); o.stop(now+.32); },
  bump(){ if(!AC) return; const now=AC.currentTime;
    const o1=AC.createOscillator(); o1.type='sine'; o1.frequency.value=110; const g1=AC.createGain(); g1.gain.value=0; o1.connect(g1).connect(gSFX);
    g1.gain.setValueAtTime(.001,now); g1.gain.linearRampToValueAtTime(.9,now+.01); g1.gain.exponentialRampToValueAtTime(.001,now+.22); o1.start(now); o1.stop(now+.24);
    const o2=AC.createOscillator(); o2.type='triangle'; o2.frequency.value=520; const g2=AC.createGain(); g2.gain.value=0; o2.connect(g2).connect(gSFX);
    g2.gain.setValueAtTime(.001,now+.01); g2.gain.linearRampToValueAtTime(.6,now+.04); g2.gain.exponentialRampToValueAtTime(.001,now+.14); o2.start(now+.01); o2.stop(now+.16);
    const src=AC.createBufferSource(); const len=AC.sampleRate*.10, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.4; for(let p=0;p<2;p++) for(let i=1;i<len;i++) d[i]=d[i-1]*.85+d[i]*.15;
    src.buffer=buf; const g=AC.createGain(); g.gain.value=0; src.connect(g).connect(gSFX);
    g.gain.setValueAtTime(.001,now); g.gain.linearRampToValueAtTime(.5,now+.02); g.gain.linearRampToValueAtTime(0,now+.10);
    src.start(now); src.stop(now+.12); },
  celesta(){ if(!AC) return; const now=AC.currentTime, step=.12;
    [1318.5,1568.0,2093.0].forEach((f,i)=>{ const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const g=AC.createGain(); g.gain.value=0; o.connect(g).connect(gSFX);
      const t=now+i*step; g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.7,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+.6);
      o.start(t); o.stop(t+.62); }); },
  whoom(){ if(!AC) return; const now=AC.currentTime;
    const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(55,now);
    o.frequency.exponentialRampToValueAtTime(36,now+.42);
    const g=AC.createGain(); g.gain.setValueAtTime(.001,now);
    g.gain.linearRampToValueAtTime(.9,now+.04);
    g.gain.exponentialRampToValueAtTime(.002,now+.7);
    const n=AC.createBufferSource(); const len=AC.sampleRate*.25, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const t=i/AC.sampleRate; const env=Math.exp(-6*t); d[i]=(Math.random()*2-1)*.35*env; }
    const gn=AC.createGain(); gn.gain.value=.35;
    n.buffer=buf; o.connect(g).connect(gSFX); n.connect(gn).connect(gSFX);
    o.start(now); n.start(now+.02); o.stop(now+.72); n.stop(now+.28);
  },
  angelArrival(){ if(!AC) return; const now=AC.currentTime;
    // A soft, rising celestial swell, then a three-note bell-like arrival.
    const sub=AC.createOscillator(), subGain=AC.createGain(); sub.type='sine';
    sub.frequency.setValueAtTime(78,now); sub.frequency.exponentialRampToValueAtTime(48,now+.9);
    subGain.gain.setValueAtTime(.001,now); subGain.gain.linearRampToValueAtTime(.22,now+.12);
    subGain.gain.exponentialRampToValueAtTime(.001,now+1.05); sub.connect(subGain).connect(gSFX);
    sub.start(now); sub.stop(now+1.08);
    const shimmer=AC.createOscillator(), shimmerGain=AC.createGain(); shimmer.type='sine';
    shimmer.frequency.setValueAtTime(520,now); shimmer.frequency.exponentialRampToValueAtTime(1040,now+.65);
    shimmerGain.gain.setValueAtTime(.001,now); shimmerGain.gain.linearRampToValueAtTime(.11,now+.38);
    shimmerGain.gain.exponentialRampToValueAtTime(.001,now+1.35); shimmer.connect(shimmerGain).connect(gSFX);
    shimmer.start(now); shimmer.stop(now+1.38);
    [1046.5,1318.5,1568,2093].forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g).connect(gSFX); const t=now+.72+i*.16;
      g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(i===0?.22:.12,t+.025);
      g.gain.exponentialRampToValueAtTime(.001,t+1.35); o.start(t); o.stop(t+1.38);
    });
  }
};

// Original procedural sound palette: no sampled recordings or external assets.
const JourneyAudio=(()=>{
  const voices=new Set(); let wind=null, noise=null, nextStep=0, nextCricket=3, stage=0;
  function track(source,nodes){
    voices.add(source);
    source.onended=()=>{voices.delete(source);for(const node of [source,...nodes])node.disconnect();};
  }
  function tone(hz,at,duration,level=.12,to=hz,type='sine'){
    if(!AC||AC.state!=='running')return;
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;
    o.frequency.setValueAtTime(hz,at);o.frequency.exponentialRampToValueAtTime(to,at+duration);
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(level,at+.012);
    g.gain.exponentialRampToValueAtTime(.0001,at+duration);
    o.connect(g).connect(gSFX);track(o,[g]);o.start(at);o.stop(at+duration+.02);
  }
  function notes(pitches,level=.12,step=.16,duration=.65){
    if(!AC)return; pitches.forEach((hz,i)=>tone(hz,AC.currentTime+i*step,duration,level));
  }
  function makeNoise(){
    if(noise)return noise;
    noise=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);const data=noise.getChannelData(0);let smooth=0;
    for(let i=0;i<data.length;i++){smooth=.96*smooth+.04*(Math.random()*2-1);data[i]=smooth*4;}
    return noise;
  }
  function sand(level=.12,duration=.09){
    if(!AC||AC.state!=='running')return;
    const source=AC.createBufferSource(),filter=AC.createBiquadFilter(),g=AC.createGain();
    source.buffer=makeNoise();filter.type='lowpass';filter.frequency.value=1200;
    g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(level,AC.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+duration);
    source.connect(filter).connect(g).connect(gSFX);track(source,[filter,g]);
    source.start(AC.currentTime,Math.random()*2);source.stop(AC.currentTime+duration+.02);
  }
  function stop(){
    for(const source of voices){try{source.stop();}catch{}}
    voices.clear();wind=null;
  }
  function start(){
    stop();nextStep=.25;nextCricket=3;stage=0;if(!AC||AC.state!=='running')return;
    const source=AC.createBufferSource(),filter=AC.createBiquadFilter(),g=AC.createGain();
    source.buffer=makeNoise();source.loop=true;filter.type='lowpass';filter.frequency.value=650;
    g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(.035,AC.currentTime+2);
    source.connect(filter).connect(g).connect(gSFX);track(source,[filter,g]);wind=g;source.start();
    notes([523.25,659.25,783.99],.10,.18,.85);
  }
  function tick(time,grounded){
    if(!AC||AC.state!=='running')return;
    if(wind)wind.gain.setTargetAtTime(.025+.012*(1+Math.sin(time*.37)),AC.currentTime,.5);
    if(time>=nextStep){nextStep=time+.38;if(grounded)sand(.10,.075);}
    if(time>=nextCricket){nextCricket=time+7+Math.random()*4;
      for(let i=0;i<3;i++)tone(3100,AC.currentTime+i*.13,.055,.012,3250);
    }
    if(stage===0&&time>=10){stage=1;notes([523.25,659.25,783.99],.13,.15);}
    if(stage===1&&time>=25){stage=2;notes([523.25,659.25,783.99,1046.5],.14,.18,.95);}
    if(stage===2&&time>=50){stage=3;notes([261.63,329.63,392,523.25],.14,.22,1.4);}
  }
  return {start,stop,tick,
    jump(){if(AC)tone(240,AC.currentTime,.23,.13,540);},
    land(){sand(.23,.16);},
    star(){notes([1046.5,1568,2093],.065,.08,.48);},
    win(){stop();notes([523.25,659.25,783.99,1046.5],.20,.22,1.7);},
    retry(){stop();notes([392,329.63,261.63,329.63],.13,.23,.7);}
  };
})();

document.addEventListener('visibilitychange',()=>{
  if(!AC)return;
  if(document.hidden)AC.suspend().catch(()=>{});
  else if(running||revealingStart)AC.resume().catch(()=>{});
});

/* ===== Game tunables ===== */
const groundH=140, speed=240, grav=2150, jumpV=1050;
const minGap=420, walkSpeed=120, settleFrac=0.32, pushBackFrac=0.06;

/* ===== State ===== */
let running=false, elapsed=0, timer=60, hits=0;
let groundX=0, targetX=0, spawnTimer=0, wasAir=false;
const man={x:-120,y:0,vy:0,w:92,h:132,t:0,scale:1};
const onGround=()=> man.y >= (cvs.height/(devicePixelRatio||1)) - groundH - man.h - .5;

const companions=[];
let starPopActive=false, starPopT=0, endDelay=0;
let megaPulseFired=false;
let megaPulseT=0;
let landingAt=-100;

/* ===== Dust ===== */
const dust=[];
function puff(x,y,count=6,power=1){
  const base=.28+Math.random()*.14;
  for(let i=0;i<count;i++){
    const ang=(Math.random()*Math.PI)-Math.PI/2, spd=(70+Math.random()*90)*power;
    dust.push({x,y,vx:Math.cos(ang)*spd,vy:-Math.abs(Math.sin(ang))*spd*.45,r:2+Math.random()*3.2,life:base,age:0,c:Math.random()<.5?'rgba(214,161,85,1)':'rgba(171,121,61,1)'});
  }
  if(dust.length>200) dust.splice(0,dust.length-200);
}

/* A lighter footfall trail for the wise man, separate from impact dust. */
const wiseManTrail=[];
let lastWiseFootfall=-1;
function updateFootfallTrail(trail,dt,runner,grounded,lighter=false){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const life=lighter?.43:.50;
  for(let i=trail.length-1;i>=0;i--){
    const p=trail[i];p.age+=dt;p.x-=(lighter?44:52)*dt;
    if(p.age>=life||reduced)trail.splice(i,1);
  }
  const footfall=Math.floor(runner.t*1.05/Math.PI);

/* ===== Distant travelers and Bethlehem gathering ===== */
const Cameo = (() => {
  // Approved family groups replace every former procedural background person.
  // Start larger than the old ridge figures, then grow with the Bethlehem scenes.
  // The whole gathering finishes fading in by 21.8s, ahead of background 3.
  const groups = [
    {key:'friends', x:.18, y:.60, at:5},
    {key:'amy', x:.37, y:.60, at:8},
    {key:'father-daughters', x:.54, y:.60, at:12},
    {key:'sister-kids', x:.79, y:.60, at:17}
  ].map(g=>({...g, image:Img(`cast/${g.key}-v1.png`)}));
  const animals = [
    {key:'tabby', x:.52, y:.635, h:18, at:10},
    {key:'sheep', x:.10, y:.625, h:23, at:11},
    {key:'camel-red', x:.65, y:.617, h:30, at:15},
    {key:'camel-blue', x:.91, y:.615, h:29, at:19},
    // Captain joins last, seated at Jake's feet beside the daughters.
    {key:'captain-sitting', x:.575, y:.655, h:27, at:21}
  ].map(a=>({...a, image:Img(`cast/${a.key}-v1.png`)}));
  // Offsets identify individual faces while the family artwork stays together.
  const figs = [
    {group:0, offset:-.30},{group:0, offset:0},{group:0, offset:.29},
    {group:1, offset:0},
    {group:2, offset:-.21},{group:2, offset:0},{group:2, offset:.22},
    {group:3, offset:-.13},{group:3, offset:.10},
    {group:3, offset:-.20},{group:3, offset:.27}
  ];
  // Match feet to each painting's sandy foreground, blending with the scene.
  // Arrival keeps its approved .58 baseline unchanged.
  function crowdBaseline(H,elapsed){
    const {approachAt,arrivalAt,fadeSeconds}=JOURNEY_BACKGROUND_TIMING;
    const fadeTo=at=>Math.max(0,Math.min(1,(elapsed-at+fadeSeconds)/fadeSeconds));
    return H*(.64+.07*fadeTo(approachAt)-.13*fadeTo(arrivalAt));
  }
  function crowdHeight(W,elapsed){
    const {approachAt,arrivalAt,fadeSeconds}=JOURNEY_BACKGROUND_TIMING;
    const fadeTo=at=>Math.max(0,Math.min(1,(elapsed-at+fadeSeconds)/fadeSeconds));
    const scale=1.25+.35*fadeTo(approachAt)+.40*fadeTo(arrivalAt);
    return Math.min(49,Math.max(37,W*.105))*scale*1.10;
  }
  // Only people get the extra close-up; animal sizes retain their existing progression.
  function peopleHeight(W,elapsed){
    const {approachAt,arrivalAt}=JOURNEY_BACKGROUND_TIMING;
    const approach=Math.max(0,Math.min(1,(elapsed-approachAt)/(arrivalAt-approachAt)));
    return crowdHeight(W,elapsed)*1.05*(1+.18*approach);
  }
  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');

  const sayings = [
    'The King has been born!',
    'We’ve come to worship the child.',
    'We followed the star all this way.',
    'Make way—the King has come!',
    'Good news! The promised Savior is here!',
    'The star has led us here!',
    'We seek the newborn King!',
    'A new King has come!',
    'The child is in Bethlehem!',
    'We have come from afar!',
    'The heavens announced His birth!',
    'The promised King is here!',
    'Let every heart rejoice!',
    'We bring gifts for the King!',
    'Come and see the child!'
  ];

  // Give each phrase a different traveler and a slightly varied speaking time.
  // The crowd should feel like individuals, not a repeating announcement loop.
  function shuffled(values){
    const result = [...values];
    for(let i=result.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
  }
  let speechEvents = [];
  function resetSpeech(){
    const phraseOrder = shuffled(sayings);
    let availableSpeakers = figs.map((_, index)=>index);
    let nextAt = 6;
    speechEvents = phraseOrder.map(text=>{
      const eligible=figs.map((f,i)=>i).filter(i=>groups[figs[i].group].at<=nextAt);
      let pool=eligible.filter(i=>availableSpeakers.includes(i));
      if(!pool.length){ availableSpeakers=figs.map((_,i)=>i); pool=eligible; }
      const speaker=pool[Math.floor(Math.random()*pool.length)];
      availableSpeakers=availableSpeakers.filter(i=>i!==speaker);
      const event = { text, speaker, at: nextAt, until: nextAt + 2.2 };
      nextAt = event.until + 0.7 + Math.random()*0.4;
      return event;
    });
  }
  resetSpeech();

  function drawSpeech(elapsed, W, H, reveal){
    if(reveal < 1) return;
    const event = speechEvents.find(item=>elapsed >= item.at && elapsed < item.until);
    if(!event || groups[figs[event.speaker].group].at > elapsed) return;
    const f = figs[event.speaker];
    const group=groups[f.group], figureHeight=peopleHeight(W,elapsed);
    const px=group.x*W+f.offset*figureHeight, py=crowdBaseline(H,elapsed)+(group.y-.60)*H;
    const bob=reducedMotion.matches?0:Math.sin(elapsed*.35+f.group)*.6;
    const text = event.text;
    const fontSize = Math.max(11, Math.min(15, W * 0.014));
    const padX = 10, padY = 7, maxWidth = W * 0.42;
    ctx.save();
    ctx.font = `600 ${fontSize}px system-ui, sans-serif`;
    const words = text.split(' '), lines = [];
    let line = '';
    for(const word of words){
      const next = line ? `${line} ${word}` : word;
      if(ctx.measureText(next).width > maxWidth - padX*2 && line){ lines.push(line); line = word; }
      else line = next;
    }
    if(line) lines.push(line);
    const lineHeight = fontSize * 1.25;
    const width = Math.min(maxWidth, Math.max(...lines.map(value=>ctx.measureText(value).width)) + padX*2);
    const height = lines.length*lineHeight + padY*2;
    const x = Math.max(6, Math.min(W-width-6, px-width/2));
    const y = Math.max(8, py + bob - figureHeight - 9 - height);
    ctx.globalAlpha = 0.96;
    ctx.fillStyle = '#fff8e8'; ctx.strokeStyle = '#bd9d63'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x, y, width, height, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(Math.max(x+14,Math.min(x+width-14,px)), y+height);
    ctx.lineTo(Math.max(x+18,Math.min(x+width-10,px+5)), y+height+8);
    ctx.lineTo(Math.max(x+10,Math.min(x+width-18,px-5)), y+height); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#263344'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((value,index)=>ctx.fillText(value,x+width/2,y+padY+lineHeight*(index+0.5)));
    ctx.restore();
  }

  function drawCastSprite(actor,elapsed,W,H,height,isPerson=false){
    const image=actor.image;
    if(!image.complete || !image.naturalWidth || elapsed<actor.at) return;
    const fade=Math.min(1,(elapsed-actor.at)/.8);
    const width=height*image.naturalWidth/image.naturalHeight;
    const bob=reducedMotion.matches?0:Math.sin(elapsed*.35+actor.x*9)*.6;
    const baseline=crowdBaseline(H,elapsed)+(actor.y-.60)*H;
    ctx.save();
    ctx.globalAlpha=fade;
    if(isPerson) ctx.filter='contrast(1.08) brightness(1.03)';
    ctx.drawImage(image,actor.x*W-width/2,baseline-height+bob,width,height);
    ctx.restore();
  }

  function render(elapsed){
    if(elapsed<5) return;
    const dpr=Math.max(1,devicePixelRatio||1);
    const W=cvs.width/dpr,H=cvs.height/dpr;
    const height=crowdHeight(W,elapsed);
    for(const group of groups) drawCastSprite(group,elapsed,W,H,peopleHeight(W,elapsed),true);
    for(const animal of animals) drawCastSprite(animal,elapsed,W,H,animal.h*height/49);
    drawSpeech(elapsed,W,H,groups.filter(g=>elapsed>=g.at).length);
  }
  return { render, reset: resetSpeech,
    peopleTop:(W,H,time)=>crowdBaseline(H,time)-peopleHeight(W,time)-.6
  };
})();

function drawJourneyBackground(elapsed,W,H){
  const [far,approach,arrival]=journeyBackgrounds;
  const {approachAt,arrivalAt,fadeSeconds}=JOURNEY_BACKGROUND_TIMING;
  const drawImage=(img,alpha=1)=>{
    const source=img.complete&&img.naturalWidth?img:bg;
    ctx.globalAlpha=alpha;
    ctx.drawImage(source,0,0,W,H);
    ctx.globalAlpha=1;
  };
  const blend=(value,start,end)=>Math.max(0,Math.min(1,(value-start)/(end-start)));
  const approachFadeStart=approachAt-fadeSeconds;
  const arrivalFadeStart=arrivalAt-fadeSeconds;

  if(elapsed<approachFadeStart){ drawImage(far); return; }
  if(elapsed<approachAt){
    drawImage(far);
    drawImage(approach,blend(elapsed,approachFadeStart,approachAt));
    return;
  }
  if(elapsed<arrivalFadeStart){ drawImage(approach); return; }
  if(elapsed<arrivalAt){
    drawImage(approach);
    drawImage(arrival,blend(elapsed,arrivalFadeStart,arrivalAt));
    return;
  }
  drawImage(arrival);
  ctx.globalAlpha=1;
}

/* ===== Loop ===== */
let last=0;
function loop(now){
  if(!running) return;
  if(!last) last=now;
  const dt=Math.min(.033,(now-last)/1000); last=now;

  starT+=dt; elapsed+=dt; timer=Math.max(0,60-Math.floor(elapsed));
  timeEl.textContent='Time: '+String(timer).padStart(2,'0'); hitsEl.textContent=`Hits: ${hits} / 5`;

  if(!finaleTriggered && timer<=10){
    finaleTriggered=true; inFinale=true;
    const H=cvs.height/(devicePixelRatio||1), yBase=H-groundH-man.h;
    companions.push({x:man.x+150,y:yBase,w:80,h:120,t:0,scale:.92,palette:palettes[0],nodT:0});
    companions.push({x:man.x+215,y:yBase+4,w:86,h:125,t:0,scale:.96,palette:palettes[1],nodT:0});
    Sky.spawnRipple();
  }
  if(inFinale && !finaleRippleFired && timer<=9){ finaleRippleFired=true; Sky.spawnRipple(); }

  // CRAZY 200% flash + deep whoom at 43s
  if (elapsed >= 43 && !megaPulseFired) {
    megaPulseFired = true;
    megaPulseT = 0;
    if (AC) SFX.whoom();
    Sky.spawnRipple(); Sky.spawnRipple(); Sky.spawnRipple();
  }
  if (megaPulseFired && megaPulseT < 1.2) megaPulseT += dt;

  if(running && timer<=0 && endDelay<=0 && !starPopActive){ starPopActive=true; starPopT=0; endDelay=.10; }
  if(endDelay>0){ endDelay-=dt; starPopT+=dt; if(endDelay<=0){ end(true); return; } }

  Sky.tick(elapsed,dt);
  updateComets(dt);

  groundX-=speed*dt; if(groundX<=-64) groundX+=64;
  const W=cvs.width/(devicePixelRatio||1), H=cvs.height/(devicePixelRatio||1);
  if(inFinale){
    const progress=Math.min(1,(10-timer)/10); const ease=progress*progress*(3-2*progress);
    const finalX=Math.max(24,Math.min(W*.58,W-250)); const startX=Math.max(man.x,W*settleFrac);
    man.x=startX+(finalX-startX)*ease; man.scale=1;
    companions.forEach((c,i)=>{ const tx=finalX+Math.min(70,W*.2)*(i+1); c.x=c.x+(tx-c.x)*.035; c.t+=dt*6; if(progress>.85){ c.nodT+=dt; }});
  } else if(man.x<targetX){ man.x=Math.min(targetX,man.x+walkSpeed*dt); }

  man.vy+=grav*dt; man.y+=man.vy*dt; const groundedNow=onGround();
  if(groundedNow){ if(man.vy>0) man.vy=0; man.y=H-groundH-man.h; if(wasAir){ landingAt=elapsed; const fy=man.y+man.h-6; puff(man.x+man.w*.25,fy,6,.95); puff(man.x+man.w*.75,fy,6,.95); JourneyAudio.land(); } }
  wasAir=!groundedNow; man.t+=dt*8;
  updateWiseManTrail(dt,groundedNow);
  JourneyAudio.tick(elapsed,groundedNow);

  spawnTimer+=dt; const canSpawn=!inFinale && (!rocks.length || rocks[rocks.length-1].x < W - minGap);
  const every=1.6+Math.random()*1.0; if(spawnTimer>every && canSpawn){ spawnTimer=0; spawnRock(); }

  if(!inFinale){
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i]; r.x-=speed*dt; if(r.x+r.w<-20){ rocks.splice(i,1); continue; }
      const pb={x:man.x+16,y:man.y+8,w:man.w-32,h:man.h-16}, rb={x:r.x - r.w*.5, y:r.y - r.h, w:r.w, h:r.h};
      if(pb.x<rb.w+rb.x && pb.x+pb.w>rb.x && pb.y<rb.h+rb.y && pb.y+pb.h>rb.y){
        rocks.splice(i,1); hits++; const push=W*pushBackFrac, minX=-man.w*.25; man.x=Math.max(minX,man.x-push); targetX=Math.max(minX+6,targetX-push);
        const fy=man.y+man.h-6; puff(man.x+man.w*.25,fy,8,1.2); puff(man.x+man.w*.75,fy,8,1.2); SFX.bump();
        if(hits>=5){ end(false); return; }
      }
    }
  } else { for(let i=rocks.length-1;i>=0;i--){ const r=rocks[i]; r.x-=speed*dt; if(r.x+r.w<-20) rocks.splice(i,1); } }

  for(let i=dust.length-1;i>=0;i--){ const p=dust[i]; p.age+=dt; if(p.age>=p.life){ dust.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt+60*dt; p.vx*=.96; p.vy*=.90; p._a=1-(p.age/p.life); }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  const W=cvs.width/(devicePixelRatio||1), H=cvs.height/(devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  drawJourneyBackground(elapsed,W,H);

  // Draw sky stars behind the cast so they cannot cover faces or clothing.
  for(const s of stars){ const a=s.a0+s.amp*Math.sin((starT+s.phase)*(Math.PI*2/s.period));
    ctx.fillStyle=`rgba(210,225,255,${Math.max(0,Math.min(1,a))})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }

  // Approved friends, family, and animals gather in front of the sky stars.
  Cameo.render(elapsed);

  // Angel (45s)
  Sky.renderAngelArrival();

  // STAR glow — steady pulse only (no endgame growth)
  const cx=W*.5, cy=H*.22, baseR=Math.min(W,H)*.26;
  const pulse = .92+.08*Math.sin(starT*1.6);
  const r = baseR*(pulse);
  const approach=Math.max(0,Math.min(1,(elapsed-8)/42));
  const innerA = 0.22 + 0.12*approach;

  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(255,245,200,${innerA})`);
  g.addColorStop(1,'rgba(255,245,200,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // MEGA PULSE overlay — one-time CRAZY blast at 43s
  if (megaPulseFired && megaPulseT < 1.2) {
    const k = 1 - Math.min(megaPulseT / 1.2, 1);
    const blast = 2.0 * k;
    const bright = 0.8 * k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gx = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * (1 + blast));
    gx.addColorStop(0, `rgba(255,255,240,${0.6 + bright})`);
    gx.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = gx;
    ctx.beginPath(); ctx.arc(cx, cy, baseR * (1 + blast), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Ripples + shooters
  Sky.renderRipples();
  Sky.renderStars();
  // Paint her portrait above the star glow so her expression is never washed out.
  Sky.renderAngel();

  // Ground band
  ctx.save(); ctx.translate(groundX,0); const y0=H-groundH;
  ctx.fillStyle='rgba(0,0,0,0.22)'; for(let x=-64;x<W+64;x+=64) ctx.fillRect(x,y0-2,64,2);
  ctx.fillStyle='rgba(0,0,0,0.06)'; for(let x=-64;x<W+64;x+=64){ for(let i=0;i<4;i++){ const rx=x+Math.random()*64, ry=y0+12+Math.random()*(groundH-24); ctx.beginPath(); ctx.arc(rx,ry,2+Math.random()*3,0,Math.PI*2); ctx.fill(); } }
  ctx.restore();

  // Trails stay behind the running trio, with the catching-up wise man strongest.
  for(const c of companions)drawFootfallTrail(c.trail||[],H,true);
  // Companions + main
  for(const c of companions){
    const nod=c.nodT>0 ? Math.sin(c.nodT*10)*.03*Math.max(0,1-(c.nodT/.6)) : 0;
    drawWiseManVariant(c.x,c.y,c.w,c.h,c.t,true,c.scale,c.palette,nod);
  }
  const grounded=onGround();
  drawWiseManTrail(H);
  drawWiseManVariant(man.x,man.y,man.w,man.h,man.t,grounded,1,null,0);

  drawCaptainTrail(W,H);
  drawCaptain(W,H);

  // Rocks + jar lighting
  const jarEase=Math.max(0,Math.min(1,(3-Math.max(0,timer))/3)), jarIntensity=.18+.17*jarEase;
  const jarX=man.x+man.w*.75, jarY=man.y+man.h*.42, light={x:jarX,y:jarY,intensity:jarIntensity};
  for(const rRock of rocks){ drawRock(rRock.x,rRock.y,rRock.s,light); }

  // Dust
  for(const p of dust){ ctx.fillStyle=p.c.replace(',1)',`,`+(p._a*0.7).toFixed(3)+')'); ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.8+.4*(1-p._a)),0,Math.PI*2); ctx.fill(); }

  // Silent comet trails
  if(!inFinale) drawComets();
}

/* Footfall dust uses the journey clock: bounded, replay-safe, and frame-rate independent. */
function drawCaptainTrail(W,H){
  const t=elapsed-7, duration=4.2, life=.65, step=Math.PI/22;
  if(t<0||t>=duration+life||!captain.complete||!captain.naturalWidth||
     matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const height=man.h*.58, width=height*captain.naturalWidth/captain.naturalHeight;
  const feet=H-groundH+7;
  ctx.save();
  for(let n=Math.max(0,Math.ceil((t-life)/step));n<=Math.floor(t/step);n++){
    const born=n*step;
    if(born>=duration)continue;
    const age=t-born, fade=1-age/life;
    const pawX=-width+(W+width*2)*(born/duration)-width*.28;
    for(let i=0;i<3;i++){
      const x=pawX-age*(20+i*12)-i*3;
      const y=feet-3-age*(15+i*8);
      const radius=(4.8+i*1.1)*(1+age*2.1);
      ctx.fillStyle=i===1?'#e9c38a':'#ffe0a6';
      ctx.globalAlpha=.64*fade*Math.min(1,age/.035);
      ctx.beginPath();ctx.ellipse(x,y,radius*1.35,radius*.75,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

/* Captain gets one quick, purely visual run-by per journey: 7–11.2 active seconds. */
function drawCaptain(W,H){
  const t=elapsed-7, duration=4.2;
  if(t<0||t>=duration||!captain.complete||!captain.naturalWidth)return;
  const height=man.h*.58, width=height*captain.naturalWidth/captain.naturalHeight;
  const x=-width+(W+width*2)*(t/duration);
  const stride=t*22, bounce=Math.abs(Math.sin(stride))*8;
  const feet=H-groundH+7;
  ctx.save();ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,feet+2,width*.32,4,0,0,Math.PI*2);ctx.fill();
  ctx.translate(x,feet-bounce);ctx.rotate(-.035+Math.sin(stride)*.025);
  // The reference faces left; mirror him toward Bethlehem, past the wise man.
  ctx.scale(-1.05,1+Math.sin(stride)*.035);
  ctx.drawImage(captain,-width/2,-height,width,height);ctx.restore();
  // Two silent little barks, outside the mirrored sprite transform.
  const barkStart=t<2.1?.85:2.35, barkAge=t-barkStart, barkDuration=.75;
  if(barkAge>=0&&barkAge<barkDuration){
    const bw=66, bh=31, pad=8;
    const bx=Math.max(pad,Math.min(W-bw-pad,x+width*.18-bw/2));
    const by=Math.max(pad,feet-height-bounce-40-barkAge*10);
    ctx.save();ctx.globalAlpha=Math.min(1,barkAge/.09,(barkDuration-barkAge)/.14);
    ctx.fillStyle='#fff9e9';ctx.strokeStyle='#614328';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,11);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+22,by+bh-1);ctx.lineTo(bx+27,by+bh+8);ctx.lineTo(bx+35,by+bh-1);ctx.fill();ctx.stroke();
    ctx.fillStyle='#49301f';ctx.font='bold 17px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Woof!',bx+bw/2,by+bh/2);ctx.restore();
  }
}

/* Painted figures are cached at sprite resolution; a small cloth mesh animates
   the existing art without moving physics/collision coordinates. Legacy art
   below stays available if an illustration fails to load. */
const paintedWiseCache=new Map();
function wiseSprite(pal){
  const key=pal?palettes.indexOf(pal)+1:0;
  if(paintedWiseCache.has(key))return paintedWiseCache.get(key);
  const source=key?companionPainting:wiseManPainting;
  if(!source.complete||!source.naturalWidth)return null;
  const cellWidth=source.naturalWidth/(key?2:1), sx=key===2?cellWidth:0;
  const work=document.createElement('canvas');work.width=Math.round(cellWidth);work.height=source.naturalHeight;
  const c=work.getContext('2d',{willReadFrequently:true});c.drawImage(source,sx,0,cellWidth,source.naturalHeight,0,0,work.width,work.height);
  const pixels=c.getImageData(0,0,work.width,work.height).data;
  let left=work.width,top=work.height,right=0,bottom=0;
  for(let y=0;y<work.height;y++)for(let x=0;x<work.width;x++)if(pixels[(y*work.width+x)*4+3]>16){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);}
  if(right<=left||bottom<=top)return null;
  const sprite=document.createElement('canvas');sprite.height=256;sprite.width=Math.round(256*(right-left+1)/(bottom-top+1));
  sprite.getContext('2d').drawImage(work,left,top,right-left+1,bottom-top+1,0,0,sprite.width,sprite.height);
  paintedWiseCache.set(key,sprite);return sprite;
}
function drawPaintedWiseMan(x,y,w,h,t,grounded,scale,pal,tilt){
  const sprite=wiseSprite(pal);if(!sprite)return false;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const phase=t*1.05, stride=reduced?0:Math.sin(phase);
  const bob=grounded&&!reduced?Math.sin(phase*2)*1.8:0;
  const jump=grounded?0:Math.max(-1,Math.min(1,man.vy/1050));
  const sinceLanding=elapsed-landingAt;
  const settle=grounded&&sinceLanding>=0&&sinceLanding<.65?Math.sin(sinceLanding*17)*Math.exp(-sinceLanding*6):0;
  const height=h*1.1,width=height*sprite.width/sprite.height;
  const footY=y+h,centerX=x+w*.5;
  ctx.save();ctx.translate(centerX,footY);ctx.scale(scale,scale);ctx.rotate(tilt||0);
  const shadowY=((cvs.height/(devicePixelRatio||1))-groundH-footY)/scale;
  ctx.fillStyle=grounded?'rgba(0,0,0,.18)':'rgba(0,0,0,.09)';ctx.beginPath();ctx.ellipse(0,shadowY+2,w*(grounded?.36:.25),grounded?4:3,0,0,Math.PI*2);ctx.fill();
  const cols=6,rows=12,points=[];
  const smooth=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
  for(let row=0;row<=rows;row++){points[row]=[];for(let col=0;col<=cols;col++){
    const u=col/cols,v=row/rows,side=u<.58?-1:1;
    const feet=smooth((v-.76)/.24),cloth=Math.max(0,1-u/.55)*Math.max(0,Math.sin(Math.PI*Math.max(0,Math.min(1,(v-.19)/.5))));
    let dx=grounded?stride*side*9*feet:(.6-u)*12*feet;
    let dy=grounded?-Math.max(0,stride*side)*5*feet:-5*feet;
    if(!reduced){dy+=cloth*(Math.sin(phase*1.6+u*5)*3-jump*17+settle*9);dx+=cloth*(jump*6+Math.sin(phase+v*4)*2);}
    points[row][col]={x:(u-.63)*width+dx,y:(v-1)*height+dy+bob*(1-feet)};
  }}
  function triangle(a,b,c,sa,sb,sc){
    const det=(sb.x-sa.x)*(sc.y-sa.y)-(sc.x-sa.x)*(sb.y-sa.y);
    const A=((b.x-a.x)*(sc.y-sa.y)-(c.x-a.x)*(sb.y-sa.y))/det;
    const B=((b.y-a.y)*(sc.y-sa.y)-(c.y-a.y)*(sb.y-sa.y))/det;
    const C=((c.x-a.x)*(sb.x-sa.x)-(b.x-a.x)*(sc.x-sa.x))/det;
    const D=((c.y-a.y)*(sb.x-sa.x)-(b.y-a.y)*(sc.x-sa.x))/det;
    ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.clip();
    ctx.transform(A,B,C,D,a.x-A*sa.x-C*sa.y,a.y-B*sa.x-D*sa.y);ctx.drawImage(sprite,0,0);ctx.restore();
  }
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const a=points[r][c],b=points[r][c+1],d=points[r+1][c],e=points[r+1][c+1];
    const sa={x:c/cols*sprite.width,y:r/rows*sprite.height},sb={x:(c+1)/cols*sprite.width,y:sa.y};
    const sd={x:sa.x,y:(r+1)/rows*sprite.height},se={x:sb.x,y:sd.y};
    triangle(a,b,e,sa,sb,se);triangle(a,e,d,sa,se,sd);
  }
  ctx.restore();return true;
}

/* ===== Character draw ===== */
function drawWiseManVariant(x,y,w,h,t,grounded,scale=1,pal,tilt=0){
  if(drawPaintedWiseMan(x,y,w,h,t,grounded,scale,pal,tilt))return;
  const P = pal || { robeTop:'#087783', robeBot:'#07515b', hat:'#c83220', beard:'#30201b', skin:'#bd8056', sash:'#a92524', jar:'#d59b2b' };
  const walk=Math.sin(t*1.05), bob=Math.sin(t*2.1)*1.8, weight=(1-Math.cos(t*2.1))*0.8;
  const bobT=bob+weight, base=y+h, stride=7*walk, liftF=Math.max(0,Math.sin(t*1.05))*3, liftB=Math.max(0,-Math.sin(t*1.05))*2.4;
  const cx=x+w*.46, headY=y+h*.145+bobT*.22, hem=grounded?walk*2.5:0;
  const gold='#efc66c', goldShade='#a8752a', dark='#18232a';
  const path=(commands,fill,stroke=null,width=1)=>{
    ctx.beginPath(); for(const c of commands){ const [op,...v]=c; ctx[op](...v); }
    if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
  };
  const roundRect=(rx,ry,rw,rh,r,fill,stroke=null,line=1)=>{
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,r);}
    else {ctx.beginPath();ctx.moveTo(rx+r,ry);ctx.arcTo(rx+rw,ry,rx+rw,ry+rh,r);ctx.arcTo(rx+rw,ry+rh,rx,ry+rh,r);ctx.arcTo(rx,ry+rh,rx,ry,r);ctx.arcTo(rx,ry,rx+rw,ry,r);}
    if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}
  };
  ctx.save();
  // Walk cycle: two visible sandals alternate beneath the robe.
  const shoe=(sx,sy,angle,lift)=>{ctx.save();ctx.translate(sx,sy-lift);ctx.rotate(angle);ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(0,0,w*.105*scale,h*.025*scale,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=goldShade;ctx.lineWidth=1.5*scale;ctx.beginPath();ctx.moveTo(-w*.055,0);ctx.lineTo(w*.05,0);ctx.stroke();ctx.restore();};
  shoe(x+w*.34-stride*.48,base-4,-.10,liftB); shoe(x+w*.68+stride*.42,base-4,.08,liftF);

  // Sleeves sit behind the body and swing gently with each step.
  const armSwing=walk*.045;
  ctx.save();ctx.translate(x+w*.23,y+h*.34+bobT*.24);ctx.rotate(-.10-armSwing);
  path([['moveTo',-w*.035,-h*.025],['quadraticCurveTo',w*.02,-h*.07,w*.095,-h*.02],['lineTo',w*.16,h*.12],['quadraticCurveTo',w*.12,h*.19,w*.055,h*.15],['lineTo',-w*.035,h*.045],['closePath']],P.robeTop);
  ctx.restore();
  ctx.save();ctx.translate(x+w*.64,y+h*.34+bobT*.24);ctx.rotate(.08+armSwing);
  path([['moveTo',-w*.035,-h*.025],['quadraticCurveTo',w*.02,-h*.07,w*.095,-h*.02],['lineTo',w*.16,h*.11],['quadraticCurveTo',w*.12,h*.18,w*.055,h*.15],['lineTo',-w*.035,h*.045],['closePath']],P.robeTop);
  ctx.restore();

  // Full layered robe, with shaped shoulders, curved hem, and a shaded side panel.
  const robe=ctx.createLinearGradient(x,y+h*.27,x+w,y+h*.93);robe.addColorStop(0,P.robeTop);robe.addColorStop(.55,P.robeTop);robe.addColorStop(1,P.robeBot);
  path([['moveTo',x+w*.27,y+h*.285+bobT*.2],['quadraticCurveTo',x+w*.46,y+h*.245+bobT*.2,x+w*.64,y+h*.285+bobT*.2],['lineTo',x+w*.73,y+h*.92+bobT*.3-hem*.08],['quadraticCurveTo',x+w*.50,base+bobT*.3-hem*.16,x+w*.21,y+h*.92+bobT*.3+hem*.08],['closePath']],robe);
  path([['moveTo',x+w*.51,y+h*.30+bobT*.2],['lineTo',x+w*.64,y+h*.29+bobT*.2],['lineTo',x+w*.72,y+h*.91+bobT*.3],['quadraticCurveTo',x+w*.66,base+bobT*.28,x+w*.51,y+h*.92+bobT*.3],['closePath']],'rgba(0,0,0,.20)');
  // Gold hem and front stole add clean readable detail at game scale.
  ctx.strokeStyle=gold;ctx.lineWidth=Math.max(1.3,w*.018);ctx.beginPath();ctx.moveTo(x+w*.23,y+h*.90+bobT*.3);ctx.quadraticCurveTo(x+w*.48,base-1+bobT*.3,x+w*.71,y+h*.90+bobT*.3);ctx.stroke();
  path([['moveTo',x+w*.40,y+h*.29+bobT*.2],['lineTo',x+w*.52,y+h*.31+bobT*.2],['lineTo',x+w*.57,y+h*.89+bobT*.3],['lineTo',x+w*.45,y+h*.90+bobT*.3],['closePath']],'rgba(238,218,166,.88)');
  ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x+w*.31,y+h*.48);ctx.quadraticCurveTo(x+w*.38,y+h*.58,x+w*.30,y+h*.78);ctx.moveTo(x+w*.60,y+h*.46);ctx.quadraticCurveTo(x+w*.55,y+h*.61,x+w*.64,y+h*.78);ctx.stroke();
  // Waist sash and small clasp.
  roundRect(x+w*.27,y+h*.49+bobT*.22,w*.42,h*.055,3,P.sash,goldShade,1);
  ctx.fillStyle=gold;ctx.beginPath();ctx.arc(x+w*.49,y+h*.518+bobT*.22,w*.035,0,Math.PI*2);ctx.fill();

  // Face, ears, and beard are drawn in layers so the expression reads clearly.
  ctx.fillStyle=P.skin;ctx.beginPath();ctx.ellipse(cx,headY,w*.137,h*.095,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx-w*.14,headY+h*.005,w*.027,h*.035,0,0,Math.PI*2);ctx.ellipse(cx+w*.14,headY+h*.005,w*.027,h*.035,0,0,Math.PI*2);ctx.fill();
  path([['moveTo',cx-w*.115,headY+h*.045],['quadraticCurveTo',cx,headY+h*.085,cx+w*.115,headY+h*.045],['lineTo',cx+w*.083,headY+h*.205],['quadraticCurveTo',cx,headY+h*.30,cx-w*.083,headY+h*.205],['closePath']],P.beard);
  // Curled moustache and subtly expressive eyes, sized to read naturally at game scale.
  ctx.fillStyle=P.beard;ctx.beginPath();ctx.ellipse(cx-w*.037,headY+h*.084,w*.052,h*.027,-.15,Math.PI,Math.PI*2);ctx.ellipse(cx+w*.037,headY+h*.084,w*.052,h*.027,.15,Math.PI,Math.PI*2);ctx.fill();
  for(const side of [-1,1]){
    ctx.fillStyle='#30231d';ctx.beginPath();ctx.arc(cx+side*w*.047,headY+h*.002,w*.012,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#100d0c';ctx.beginPath();ctx.arc(cx+side*w*.048,headY+h*.002,Math.max(.8,w*.006),0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=P.beard;ctx.lineWidth=Math.max(.8,w*.009);ctx.beginPath();ctx.moveTo(cx+side*w*.02,headY-h*.02);ctx.quadraticCurveTo(cx+side*w*.06,headY-h*.024,cx+side*w*.025,headY-h*.02);ctx.stroke();
  }
  ctx.fillStyle=P.skin;ctx.beginPath();ctx.ellipse(cx+w*.012,headY+h*.046,w*.021,h*.032,.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(92,53,35,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx+w*.02,headY+h*.065);ctx.lineTo(cx+w*.06,headY+h*.075);ctx.stroke();

  // Wrapped turban with a raised crown, crossing band, and jewel.
  path([['moveTo',cx-w*.17,headY-h*.035],['quadraticCurveTo',cx-w*.18,headY-h*.15,cx-w*.07,headY-h*.17],['quadraticCurveTo',cx,headY-h*.23,cx+w*.08,headY-h*.16],['quadraticCurveTo',cx+w*.18,headY-h*.12,cx+w*.17,headY-h*.035],['quadraticCurveTo',cx,headY+h*.005,cx-w*.17,headY-h*.035],['closePath']],P.hat);
  ctx.strokeStyle=gold;ctx.lineWidth=Math.max(1.5,w*.025);ctx.beginPath();ctx.moveTo(cx-w*.15,headY-h*.075);ctx.quadraticCurveTo(cx,headY-h*.025,cx+w*.15,headY-h*.075);ctx.stroke();
  ctx.strokeStyle='rgba(255,226,157,.72)';ctx.lineWidth=Math.max(1,w*.012);ctx.beginPath();ctx.moveTo(cx-w*.075,headY-h*.155);ctx.quadraticCurveTo(cx,headY-h*.105,cx+w*.10,headY-h*.14);ctx.stroke();
  // Broad folded tail and ruby brooch echo the red-and-gold intro turban.
  path([['moveTo',cx-w*.13,headY-h*.06],['quadraticCurveTo',cx-w*.20,headY+h*.09,cx-w*.13,headY+h*.20],['lineTo',cx-w*.04,headY+h*.12],['lineTo',cx-w*.055,headY+h*.015],['closePath']],P.hat,goldShade,Math.max(1,w*.012));
  ctx.fillStyle=gold;ctx.beginPath();ctx.ellipse(cx+w*.075,headY-h*.085,w*.048,h*.042,-.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b71820';ctx.beginPath();ctx.ellipse(cx+w*.075,headY-h*.085,w*.031,h*.029,-.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,232,196,.85)';ctx.beginPath();ctx.arc(cx+w*.065,headY-h*.098,Math.max(.8,w*.008),0,Math.PI*2);ctx.fill();

  // Forearm and gift: a small golden vessel remains visible during the walk cycle.
  ctx.strokeStyle=P.skin;ctx.lineWidth=Math.max(3,w*.055);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+w*.67,y+h*.39+bobT*.2);ctx.lineTo(x+w*.77,y+h*.43+bobT*.2);ctx.stroke();
  const gx=x+w*.78, gy=y+h*.435+bobT*.2, gw=w*.18, gh=h*.12;
  roundRect(gx-gw*.5,gy-gh*.22,gw,gh*.72,3,P.jar,goldShade,1);
  roundRect(gx-gw*.56,gy-gh*.34,gw*1.12,gh*.20,2,'#f2ca68',goldShade,1);
  ctx.strokeStyle='#fff0b2';ctx.lineWidth=Math.max(1,w*.018);ctx.beginPath();ctx.moveTo(gx,gy-gh*.30);ctx.lineTo(gx,gy+gh*.48);ctx.moveTo(gx-gw*.49,gy-gh*.04);ctx.lineTo(gx+gw*.49,gy-gh*.04);ctx.stroke();
  ctx.fillStyle=P.skin;ctx.beginPath();ctx.arc(gx-w*.035,gy-gh*.02,w*.035,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// Prepare all three trimmed sprite caches before the finale needs them.
Promise.allSettled([wiseManPainting.decode(),companionPainting.decode()]).then(()=>{
  const prepare=()=>{wiseSprite(null);palettes.forEach(p=>wiseSprite(p));};
  if(window.requestIdleCallback)requestIdleCallback(prepare);else setTimeout(prepare,0);
});

/* ===== Start loop ===== */
})();
