<!-- BibleBucket universal header include -->
<header class="bb-site-header">
  <a href="/index.html" class="bb-logo-link" title="Go Home" aria-label="Go to BibleBucket home">
    <img id="bb-logo" class="bb-logo" alt="BibleBucket logo">
  </a>
  <div class="bb-brand"><h1>BibleBucket</h1></div>
  <nav class="bb-nav" id="bb-nav" aria-label="Primary navigation">
    <a href="/index.html">Home</a>
    <a href="/games/index.html">Games</a>
    <a href="/comic/index.html">Comics</a>
    <a href="/mysteries/index.html">Mysteries</a>
    <a href="/bibleindex/index.html">Complete Bible Index</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<link id="bb-header-style" rel="stylesheet" href="/assets/site-header.css" />



<script>
  // fix paths and logo fallback for local file preview or live site
  (function () {
    const isLocal = location.protocol === 'file:';
    const logo = document.getElementById('bb-logo');
    const headerStyle = document.getElementById('bb-header-style');
    const stylePaths = isLocal ? ['site-header.css','../assets/site-header.css','/assets/site-header.css'] : ['/assets/site-header.css','assets/site-header.css'];
    let styleIndex = 0;
    function setNextStyle(){ if (styleIndex<stylePaths.length) headerStyle.href = stylePaths[styleIndex++]; }
    headerStyle.onerror = setNextStyle;
    if (isLocal) setNextStyle();
    const logos = isLocal
      ? ['logo.png','/assets/logo.png','../assets/logo.png']
      : ['/assets/logo.png','assets/logo.png'];
    let i = 0;
    function setNext(){ if (i<logos.length) logo.src = logos[i++]; }
    logo.onerror = setNext;
    setNext();

    // fix nav links for local preview
    if (isLocal) {
      document.querySelectorAll('#bb-nav a').forEach(a => {
        if (a.getAttribute('href').startsWith('/'))
          a.setAttribute('href', a.getAttribute('href').slice(1));
      });
      const link = document.querySelector('.bb-logo-link');
      link.setAttribute('href', 'index.html');
    }
  })();
</script>

<!-- Real visitor logger -->
<script src="/assets/track.js" defer></script>
